name: Functions CI

# Tests unitaires Deno des Edge Functions (logique de paiement, sans base ni réseau).
on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-ci.yml"

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      # Lancés depuis supabase/functions : deno ne découvre la carte d'imports
      # (deno.json) que depuis ce dossier — depuis la racine, le package.json
      # pnpm du monorepo prend la main et « @std/assert » ne se résout plus.
      # --allow-env : les tests fixent PAYMENT_PROVIDER / AIRTEL_CALLBACK_* .
      - name: Lint
        working-directory: supabase/functions
        run: deno lint .
      - name: Tests unitaires
        working-directory: supabase/functions
        run: deno test --allow-env .
