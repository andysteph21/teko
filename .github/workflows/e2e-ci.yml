name: E2E CI

# Tests end-to-end sur la stack Supabase locale (Docker) : utilisateurs seed
# créés via l'API admin, actions jouées avec de vrais JWT à travers PostgREST
# (RLS exercée comme en production), assertions sur la réaction de la base.

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/e2e-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/e2e-ci.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Stack complète (Auth, PostgREST, Realtime, Storage) + migrations + seed.
      - name: Start Supabase
        run: supabase start

      - name: Exporter les clés locales (API_URL, ANON_KEY, SERVICE_ROLE_KEY, DB_URL)
        # `supabase status -o env` émet des valeurs GUILLEMETÉES (KEY="valeur").
        # Le fichier $GITHUB_ENV prend la valeur À LA LETTRE : les guillemets
        # restent DANS la variable, et supabase-js/pg les rejettent
        # (« Invalid supabaseUrl » ; DB_URL parsée avec l'hôte « base »).
        # En local ça passe car on fait `eval` (le shell retire les guillemets),
        # pas la CI. On dé-guillemète donc à l'écriture — et on ne garde que les
        # vraies lignes KEY=VALUE (une ligne parasite casserait $GITHUB_ENV).
        run: |
          supabase status -o env \
            | grep -E '^[A-Z0-9_]+=' \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances de test
        working-directory: supabase/tests/e2e
        run: npm install

      - name: Tests e2e
        working-directory: supabase/tests/e2e
        run: npm test

      - name: Stop Supabase
        if: always()
        run: supabase stop
