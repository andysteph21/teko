name: Maps CI

# @teko/maps + @teko/api-client : typecheck + tests unitaires (purs), puis
# tests d'intégration contre la stack Supabase locale (repères, heartbeat,
# positions Realtime, auth OTP de test, listes RLS).

on:
  pull_request:
    paths:
      - "packages/maps/**"
      - "packages/api-client/**"
      - "packages/config/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/maps-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/maps/**"
      - "packages/api-client/**"
      - "packages/config/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/maps-ci.yml"

jobs:
  maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/maps
        run: pnpm typecheck

      - name: Tests unitaires
        working-directory: packages/maps
        run: pnpm test:unit

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Exporter les clés locales
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Tests d'intégration (repères, heartbeat, Realtime)
        working-directory: packages/maps
        run: pnpm test

      - name: Tests d'intégration api-client (auth OTP, listes RLS)
        working-directory: packages/api-client
        run: pnpm test

      - name: Stop Supabase
        if: always()
        run: supabase stop
