name: Maps CI

# @teko/maps + @teko/api-client : typecheck + tests unitaires (purs), puis
# tests d'intégration contre la stack Supabase locale (repères, heartbeat,
# positions Realtime, auth OTP de test, listes RLS).

on:
  pull_request:
    paths:
      - "packages/maps/**"
      - "packages/api-client/**"
      - "packages/config/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "tools/audit/prepare-bench.mjs"
      - "tools/audit/run-bench.mjs"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/maps-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/maps/**"
      - "packages/api-client/**"
      - "packages/config/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "tools/audit/prepare-bench.mjs"
      - "tools/audit/run-bench.mjs"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/maps-ci.yml"

jobs:
  maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/maps
        run: pnpm typecheck

      - name: Tests unitaires
        working-directory: packages/maps
        run: pnpm test:unit

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start Supabase
        run: |
          node tools/audit/prepare-bench.mjs
          supabase start --workdir /tmp/teko-alpha-bench --exclude studio,postgres-meta,logflare,vector,supavisor

      - name: Tests d'intégration (repères, heartbeat, Realtime)
        run: node tools/audit/run-bench.mjs pnpm --dir "$GITHUB_WORKSPACE/packages/maps" test

      - name: Tests d'intégration api-client (auth OTP, listes RLS)
        run: node tools/audit/run-bench.mjs pnpm --dir "$GITHUB_WORKSPACE/packages/api-client" test

      - name: Stop Supabase
        if: always()
        run: supabase stop --project-id teko-alpha-audit
