# CI racine du monorepo — lint Biome + typecheck/tests/builds turbo sur les
# apps et packages. Les tests d'intégration Supabase restent dans maps-ci
# (stack locale) ; ici les suites unitaires portent les gates de couverture.

name: monorepo-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "biome.json"
      - "turbo.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "tools/audit/check-links.mjs"
      - "tools/audit/check-pickup-ui.mjs"
      - "tools/audit/check-estimates-ui.mjs"
      - "tools/audit/check-task-lifetime.mjs"
      - ".github/workflows/monorepo-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "biome.json"
      - "turbo.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "tools/audit/check-links.mjs"
      - "tools/audit/check-pickup-ui.mjs"
      - "tools/audit/check-estimates-ui.mjs"
      - "tools/audit/check-task-lifetime.mjs"
      - ".github/workflows/monorepo-ci.yml"

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests et gates de couverture
        run: pnpm test

      - name: Liens malformés Expo Router
        run: node tools/audit/check-links.mjs

      - name: Vérifier que le test détecte une commande avant confirmation du prix
        run: |
          node tools/audit/check-pickup-ui.mjs prepare
          if pnpm --filter @teko/app-client exec jest --runInBand meeting-screen.test.tsx --testNamePattern 'confirme le repère suggéré' --config ../../.local/alpha-evidence/pickup-ui-mutation/jest.config.json --json --outputFile ../../.local/alpha-evidence/pickup-ui-mutation/jest-result.json > .local/alpha-evidence/pickup-ui-mutation-run.log 2>&1; then
            echo 'La faute injectée aurait dû faire échouer le test.' >&2
            exit 1
          fi
          node tools/audit/check-pickup-ui.mjs verify

      - name: Vérifier l'absence de relance des devis à la reconnexion
        run: node tools/audit/check-estimates-ui.mjs

      - name: Cycle de tâche GPS et faute de terminaison prématurée
        run: node tools/audit/check-task-lifetime.mjs

      - name: Builds séquentiels
        run: pnpm build

      - name: Archiver la preuve du test mordant
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickup-ui-mutation
          include-hidden-files: true
          path: |
            .local/alpha-evidence/pickup-ui-mutation/*.json
            .local/alpha-evidence/pickup-ui-mutation/*.log
            .local/alpha-evidence/pickup-ui-mutation-run.log
            .local/alpha-evidence/estimates-ui-mutation/*.json
            .local/alpha-evidence/estimates-ui-mutation/*.log
            .local/alpha-evidence/task-lifetime/*.json
          if-no-files-found: ignore
