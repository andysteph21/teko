# Configuration locale Supabase (minimale). À régénérer avec `supabase init`
# si votre version de CLI attend des champs supplémentaires.
project_id = "teko"

[db]
# Aligne le Postgres local sur la cible de production.
major_version = 17

[auth]
enabled = true
# Liens profonds des apps Expo (retours d'auth) + admin local.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["teko-client://auth", "teko-driver://auth", "http://127.0.0.1:3000"]

# Auth téléphone (parcours C-03/C-04, D-03) — en local, PAS de fournisseur
# SMS : les numéros de test ci-dessous acceptent un code fixe, sans réseau.
# Le fournisseur réel (question n° 21, CL-03) sera configuré par environnement.
[auth.sms]
enable_signup = true
enable_confirmations = true

# Fournisseur factice : la CLI n'active l'auth téléphone que si un
# fournisseur est déclaré. Les numéros de test court-circuitent AVANT tout
# appel réel — Twilio n'est jamais contacté en local. TWILIO_AUTH_TOKEN est
# optionnel (absent → vide, sans incidence).
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# Numéros de test (format E.164 sans « + ») → code OTP accepté.
# Convention locale : …0001 client, …0002 chauffeur, …0003 admin,
# …0004 client 2, …0005 admin ops, …0006 admin carto, …0007 admin finance,
# …0008 réserve (changement de numéro / récupération).
[auth.sms.test_otp]
24107000001 = "123456"
24107000002 = "123456"
24107000003 = "123456"
24107000004 = "123456"
24107000005 = "123456"
24107000006 = "123456"
24107000007 = "123456"
24107000008 = "123456"

# Fonction webhook du push : appelée par pg_net (secret partagé applicatif),
# pas par un client authentifié — le JWT est vérifié par le secret x-teko.
[functions.notify-push]
verify_jwt = false
