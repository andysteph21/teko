# Le pilote reçoit le code lu avec le seul JWT passager via ADB après focus PIN.
# Aucun code personnel n'est enregistré dans ce flow ; banc synthétique USB.
appId: ga.teko.driver.alpha
---
- assertVisible: "BANC USB · GPS FICTIF À LIBREVILLE"
- extendedWaitUntil:
    visible:
      id: "offer-accept"
    timeout: 120000
- tapOn:
    id: "offer-accept"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: "ride-arrive"
    timeout: 20000
- tapOn:
    id: "ride-arrive"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: "ride-request-pin"
    timeout: 20000
- tapOn:
    id: "ride-request-pin"
    waitToSettleTimeoutMs: 0
- tapOn:
    id: "pin"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: "ride-complete"
    timeout: 120000
- takeScreenshot: driver-started-keyboard-closed
