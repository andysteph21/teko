<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>D-11b Attente au point de rencontre</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; inset:0; }
  .status { position:absolute; top:0; left:0; right:0; background:#007A6A; padding:16px; display:flex; align-items:center; gap:12px; }
  .status h2 { color:#fff; font-size:16px; font-weight:700; margin:0; }
  .status p { color:#CBF3ED; font-size:12px; margin:2px 0 0; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:#FFFFFF; border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,0.14); padding:8px 20px 18px; }
  .handle { width:36px; height:4px; border-radius:9999px; background:#E0E0EA; margin:0 auto 12px; }
  .pax { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .avatar { width:42px; height:42px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; flex:none; }
  .pax h4 { font-size:15px; font-weight:600; margin:0; }
  .pax p { font-size:12px; color:#6B6B80; margin:1px 0 0; }
  .call { margin-left:auto; width:42px; height:42px; border-radius:9999px; background:#E6F9F0; display:flex; align-items:center; justify-content:center; flex:none; }
  .wait { background:#F9F9FB; border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .wait-head { display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:8px; }
  .wait-head .mono { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-weight:900; color:#007A6A; }
  .bar { height:6px; border-radius:9999px; background:#E0E0EA; overflow:hidden; }
  .bar span { display:block; height:100%; width:38%; background:#00BFA5; }
  .wait p { font-size:11.5px; color:#6B6B80; margin:8px 0 0; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:#00BFA5; color:#fff; font-size:17px; font-weight:700; font-family:inherit; margin-bottom:8px; }
  .noshow { height:44px; border:none; border-radius:20px; width:100%; background:#F0F0F5; color:#9090A8; font-size:14px; font-weight:600; font-family:inherit; }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 800" role="img" aria-label="En attente au point de rencontre">
      <rect width="360" height="800" fill="#F2F1F7"/>
      <path d="M0 320 L360 290" stroke="#FFE3B3" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 320 L360 290" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M180 100 V800 M0 200 H360 M0 500 H360" stroke="#FFFFFF" stroke-width="6"/>
      <circle cx="268" cy="296" r="26" fill="#22C47A" opacity="0.15"/>
      <path d="M268 308c-9-8-14-15-14-23a14 14 0 1 1 28 0c0 8-5 15-14 23z" fill="#F5A623"/>
      <g transform="translate(226,282)"><rect rx="5" width="30" height="17" fill="#00BFA5"/><rect x="6" y="3" width="12" height="11" rx="2" fill="#E0F7F4"/></g>
      <text x="216" y="336" font-size="9" fill="#6B6B80" font-family="system-ui">Marché du Mont-Bouët</text>
    </svg>
    <div class="status">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M4.5 12.5l5 5 10-11"/></svg>
      <div><h2>Vous êtes au point de rencontre</h2><p>Nadia a été prévenue — elle voit votre voiture sur sa carte</p></div>
    </div>
    <div class="sheet">
      <div class="handle"></div>
      <div class="pax">
        <div class="avatar">N</div>
        <div><h4>Nadia · ★ 4,9</h4><p>« portail bleu » · Marché du Mont-Bouët</p></div>
        <div class="call"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15874F" stroke-width="2.2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
      </div>
      <div class="wait">
        <div class="wait-head"><span>Attente du passager</span><span class="mono">3 min 07</span></div>
        <div class="bar"><span></span></div>
        <p>Après 5 minutes, vous pourrez annuler sans pénalité — motif « passager absent ».</p>
      </div>
      <button class="cta">Demander le code à Nadia</button>
      <button class="noshow">Passager absent · disponible dans 3:07</button>
    </div>
  </div>
</body></html>
