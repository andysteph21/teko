<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>D-13 Course en cours (chauffeur)</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; inset:0; }
  .guide { position:absolute; top:0; left:0; right:0; background:#1E1E30; padding:16px; display:flex; align-items:center; gap:14px; }
  .guide .arrow { width:44px; height:44px; border-radius:12px; background:#00BFA5; display:flex; align-items:center; justify-content:center; flex:none; }
  .guide h2 { color:#fff; font-size:16px; font-weight:700; margin:0; line-height:1.35; }
  .guide p { color:#A29EBC; font-size:12px; margin:2px 0 0; }
  .widget { position:absolute; bottom:176px; left:16px; background:#FFFFFF; border-radius:9999px; box-shadow:0 8px 32px rgba(0,0,0,0.16); display:flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; }
  .widget .ring { width:28px; height:28px; border-radius:9999px; background:#E0F7F4; color:#007A6A; display:flex; align-items:center; justify-content:center; }
  .widget .qty { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:12px; font-weight:700; }
  .widget .cap { font-size:9px; color:#6B6B80; margin-top:-2px; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:#FFFFFF; border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,0.14); padding:8px 20px 18px; }
  .handle { width:36px; height:4px; border-radius:9999px; background:#E0E0EA; margin:0 auto 12px; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .row h4 { font-size:15px; font-weight:600; margin:0; }
  .row p { font-size:12px; color:#6B6B80; margin:1px 0 0; }
  .time { margin-left:auto; font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:14px; font-weight:700; background:#E0F7F4; color:#007A6A; border-radius:9999px; padding:5px 12px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:700; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 800" role="img" aria-label="Guidage vers la destination">
      <rect width="360" height="800" fill="#F2F1F7"/>
      <rect x="30" y="180" width="120" height="120" rx="4" fill="#E9E7F1"/>
      <rect x="225" y="420" width="115" height="110" rx="4" fill="#E9E7F1"/>
      <path d="M0 320 L360 290" stroke="#FFE3B3" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 320 L360 290" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M180 100 V800 M0 200 H360 M0 560 H360" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M180 660 L180 316 L300 306 L300 208" fill="none" stroke="#5A1A80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(163,644) rotate(-90 17 9)"><rect rx="5" width="34" height="19" fill="#00BFA5"/><rect x="7" y="3.5" width="14" height="12" rx="2" fill="#E0F7F4"/></g>
      <path d="M300 206c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
      <text x="238" y="170" font-size="9" fill="#6B6B80" font-family="system-ui">Pharmacie de Nkembo</text>
      <text x="70" y="250" font-size="9" fill="#6B6B80" font-family="system-ui">École d'Akébé</text>
    </svg>
    <div class="guide">
      <span class="arrow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M12 20V6M6 12l6-6 6 6"/></svg></span>
      <div><h2>Continuez tout droit jusqu'à l'école d'Akébé</h2><p>Puis à gauche · destination : Pharmacie de Nkembo</p></div>
    </div>
    <div class="widget"><span class="ring"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>
      <span><span class="qty">23 Mo</span><br><span class="cap">ce mois</span></span></div>
    <div class="sheet">
      <div class="handle"></div>
      <div class="row">
        <div><h4>Course avec Nadia</h4><p>Éco · 1 200 FCFA · Espèces</p></div>
        <span class="time">08 min 12</span>
      </div>
      <button class="cta">Terminer la course</button>
    </div>
  </div>
</body></html>
