<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>D-09 Accueil chauffeur</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .header { background:#00BFA5; padding:20px 16px 14px; display:flex; align-items:center; gap:12px; }
  .header .bal { color:#fff; }
  .header .bal p { margin:0; font-size:11px; opacity:0.85; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
  .header .bal h2 { margin:0; font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:20px; font-weight:900; }
  .toggle-zone { margin-left:auto; display:flex; align-items:center; gap:8px; color:#fff; font-size:13px; font-weight:700; }
  .toggle { width:52px; height:30px; border-radius:9999px; background:#FFFFFF; position:relative; }
  .toggle::after { content:""; position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:9999px; background:#00BFA5; }
  .map-zone { flex:1; position:relative; }
  .map { position:absolute; inset:0; }
  .widget { position:absolute; bottom:14px; left:16px; background:#FFFFFF; border-radius:9999px; box-shadow:0 8px 32px rgba(0,0,0,0.16); display:flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; }
  .widget .ring { width:28px; height:28px; border-radius:9999px; background:#E0F7F4; color:#007A6A; display:flex; align-items:center; justify-content:center; }
  .widget .qty { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:12px; font-weight:700; }
  .widget .cap { font-size:9px; color:#6B6B80; margin-top:-2px; }
  .panel { background:#F9F9FB; padding:14px 16px 8px; }
  .balance-card { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .balance-card .amt { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:24px; font-weight:900; color:#15874F; margin:0; }
  .balance-card p { font-size:11.5px; color:#6B6B80; margin:1px 0 0; }
  .settle { margin-left:auto; height:38px; border:none; border-radius:16px; background:#00BFA5; color:#fff; font-size:12.5px; font-weight:700; font-family:inherit; padding:0 14px; }
  .sec { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6B6B80; margin:0 0 8px; }
  .req { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .req .ico { width:36px; height:36px; border-radius:9999px; background:#FFF8E6; display:flex; align-items:center; justify-content:center; flex:none; }
  .req h4 { font-size:13.5px; font-weight:600; margin:0; }
  .req p { font-size:11.5px; color:#6B6B80; margin:1px 0 0; }
  .req .gain { margin-left:auto; text-align:right; }
  .req .gain .m { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:14px; font-weight:700; }
  .req .gain span { font-size:10.5px; color:#6B6B80; }
  .tabs { display:flex; background:#FFFFFF; border-top:1px solid #E0E0EA; padding:8px 0 16px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:#9090A8; }
  .tab.on { color:#007A6A; }
</style></head><body>
  <div class="phone">
    <div class="header">
      <div class="bal"><p>Solde du jour</p><h2>+12 500 F</h2></div>
      <div class="toggle-zone">En ligne<span class="toggle"></span></div>
    </div>
    <div class="map-zone">
      <svg class="map" viewBox="0 0 360 330" role="img" aria-label="Carte avec votre position et les demandes proches">
        <rect width="360" height="330" fill="#F2F1F7"/>
        <rect x="24" y="40" width="110" height="90" rx="4" fill="#E9E7F1"/>
        <rect x="230" y="150" width="110" height="100" rx="4" fill="#E9E7F1"/>
        <path d="M0 160 L360 130" stroke="#FFE3B3" stroke-width="14" stroke-linecap="round"/>
        <path d="M0 160 L360 130" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <path d="M120 0 V330 M250 0 V330 M0 250 H360" stroke="#FFFFFF" stroke-width="6"/>
        <g transform="translate(163,196)"><rect rx="5" width="34" height="19" fill="#00BFA5"/><rect x="7" y="3.5" width="14" height="12" rx="2" fill="#E0F7F4"/></g>
        <path d="M96 118c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
        <path d="M292 262c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
      </svg>
      <div class="widget"><span class="ring"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>
        <span><span class="qty">21 Mo</span><br><span class="cap">ce mois</span></span></div>
    </div>
    <div class="panel">
      <div class="balance-card">
        <div><p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Teko vous doit</p><p class="amt">+12 500 FCFA</p><p>Règlement automatique cette nuit avant 04 h 00</p></div>
        <button class="settle">Détails</button>
      </div>
      <p class="sec">Demandes proches</p>
      <div class="req">
        <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B57308" stroke-width="2.2"><path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
        <div><h4>Marché du Mont-Bouët → Nkembo</h4><p>Éco · prise en charge à 4 min</p></div>
        <div class="gain"><p class="m">1 200 F</p><span>net ≈ 1 020 F</span></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>Accueil</div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 16l1.5-5h11L19 16"/><rect x="4" y="15" width="16" height="4" rx="1.5"/><circle cx="7.5" cy="19.5" r="1.4"/><circle cx="16.5" cy="19.5" r="1.4"/></svg>Courses</div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3"/></svg>Solde</div>
      <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5"/></svg>Profil</div>
    </div>
  </div>
</body></html>
