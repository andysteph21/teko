<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>D-14 Fin de course</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .content { padding:36px 24px 0; flex:1; text-align:center; }
  .check { width:60px; height:60px; border-radius:9999px; background:#E6F9F0; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.3px; margin:0 0 4px; color:#3D0F5C; }
  .sub { font-size:13px; color:#6B6B80; margin:0 0 22px; }
  .collect { background:#FFF8E6; border:1.5px solid #F5A623; border-radius:16px; padding:16px; margin-bottom:12px; }
  .collect .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#B57308; margin:0 0 4px; }
  .collect .amt { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:34px; font-weight:900; margin:0 0 4px; }
  .collect p { font-size:13px; color:#6B6B80; margin:0; }
  .detail { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; padding:6px 16px; margin-bottom:16px; }
  .line { display:flex; justify-content:space-between; font-size:13.5px; padding:9px 0; border-bottom:1px solid #F0F0F5; color:#6B6B80; }
  .line:last-child { border-bottom:none; }
  .line strong { color:#323248; font-weight:600; }
  .mono { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-variant-numeric:tabular-nums; }
  .pos { color:#15874F; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:#00BFA5; color:#fff; font-size:17px; font-weight:700; font-family:inherit; }
  .rate { display:block; text-align:center; font-size:14px; font-weight:600; color:#5A1A80; margin:12px auto 0; }
</style></head><body>
  <div class="phone">
    <div class="content">
      <div class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22C47A" stroke-width="2.6"><path d="M4.5 12.5l5 5 10-11"/></svg></div>
      <h1>Course terminée</h1>
      <p class="sub">Nadia · Marché du Mont-Bouët → Pharmacie de Nkembo · 12 min</p>
      <div class="collect">
        <p class="lbl">À encaisser en espèces</p>
        <p class="amt">1 200 FCFA</p>
        <p>Le passager vous remet le montant maintenant.</p>
      </div>
      <div class="detail">
        <div class="line"><span>Course</span><strong class="mono">1 200 FCFA</strong></div>
        <div class="line"><span>Commission Teko (15 %)</span><strong class="mono">−180 FCFA</strong></div>
        <div class="line"><span>Votre net sur cette course</span><strong class="mono pos">+1 020 FCFA</strong></div>
        <div class="line"><span>Nouveau solde du jour</span><strong class="mono pos">+13 520 FCFA</strong></div>
      </div>
      <button class="cta">J'ai encaissé — disponible</button>
      <a class="rate">Noter Nadia</a>
    </div>
  </div>
</body></html>
