<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-23 Profil & paramètres</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .header { background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); padding:30px 20px 22px; display:flex; align-items:center; gap:14px; }
  .avatar { width:60px; height:60px; border-radius:9999px; background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.85); color:#fff; font-weight:700; font-size:22px; display:flex; align-items:center; justify-content:center; }
  .header h1 { font-size:20px; font-weight:700; margin:0; color:#fff; }
  .header p { font-size:13px; color:rgba(255,255,255,0.8); margin:2px 0 0; font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; }
  .content { flex:1; padding:16px 16px 0; }
  .sec { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6B6B80; margin:12px 0 6px 4px; }
  .group { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid #F0F0F5; font-size:15px; font-weight:500; }
  .row:last-child { border-bottom:none; }
  .ico { width:34px; height:34px; border-radius:9999px; background:#F5E6FF; display:flex; align-items:center; justify-content:center; flex:none; }
  .chev { margin-left:auto; color:#C4C4D4; }
  .val { margin-left:auto; font-size:13px; color:#6B6B80; }
  .out { color:#E53E3E; }
  .out .ico { background:#FFF0F0; }
</style></head><body>
  <div class="phone">
    <div class="header">
      <div class="avatar">N</div>
      <div><h1>Nadia</h1><p>+241 06 12 34 56</p></div>
    </div>
    <div class="content">
      <p class="sec">Mon compte</p>
      <div class="group">
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5"/></svg></span>Modifier le profil<span class="chev">›</span></div>
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>Mes repères proposés<span class="val">2 validés</span></div>
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><path d="M5 8h14l-1.5 11h-11z"/><path d="M9 8a3 3 0 1 1 6 0"/></svg></span>Mes courses<span class="chev">›</span></div>
      </div>
      <p class="sec">Préférences</p>
      <div class="group">
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>Données &amp; mode éco<span class="val">13 Mo ce mois</span></div>
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></svg></span>Langue<span class="val">Français</span></div>
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg></span>Notifications<span class="chev">›</span></div>
      </div>
      <p class="sec">Aide</p>
      <div class="group">
        <div class="row"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1 1-1.1 1.8M12 17v.01"/></svg></span>Contacter Teko<span class="chev">›</span></div>
      </div>
      <p class="sec">Sortie</p>
      <div class="group">
        <div class="row"><span class="ico" style="background:#F0F0F5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4A60" stroke-width="2.2"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M15 8l4 4-4 4M19 12H9"/></svg></span>Se déconnecter<span class="chev">›</span></div>
        <div class="row out"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2.2"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg></span>Supprimer mon compte<span class="chev">›</span></div>
      </div>
    </div>
  </div>
</body></html>
