<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-20 Détail de course</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .map { height:210px; position:relative; }
  .back { position:absolute; top:22px; left:16px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; }
  .content { flex:1; padding:16px 20px 0; margin-top:-18px; background:#F9F9FB; border-radius:20px 20px 0 0; position:relative; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  h1 { font-size:18px; font-weight:700; margin:0; color:#3D0F5C; }
  .chip-ok { font-size:11px; font-weight:700; border-radius:9999px; padding:3px 10px; background:#E6F9F0; color:#15874F; }
  .when { font-size:13px; color:#6B6B80; margin:0 0 14px; }
  .card { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; padding:16px; margin-bottom:12px; }
  .route { display:flex; gap:12px; }
  .dotcol { display:flex; flex-direction:column; align-items:center; padding-top:5px; }
  .dot { width:8px; height:8px; border-radius:9999px; }
  .vline { width:2px; flex:1; min-height:16px; background:#E0E0EA; margin:2px 0; }
  .route h4 { font-size:13.5px; font-weight:600; margin:0 0 10px; }
  .route h4:last-child { margin:0; }
  .line { display:flex; justify-content:space-between; font-size:13.5px; margin:6px 0; color:#6B6B80; }
  .line strong { color:#323248; font-weight:600; }
  .mono { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-variant-numeric:tabular-nums; }
  .total { display:flex; justify-content:space-between; border-top:1px solid #F0F0F5; margin-top:8px; padding-top:10px; font-weight:700; font-size:15px; }
  .total .mono { font-size:18px; font-weight:900; }
  .actions { display:flex; gap:10px; margin-top:4px; }
  .btn { flex:1; height:44px; border:none; border-radius:20px; font-size:14px; font-weight:600; font-family:inherit; }
  .sec-btn { background:#F5E6FF; color:#5A1A80; }
  .warn-btn { background:#F0F0F5; color:#4A4A60; }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 210" role="img" aria-label="Trajet effectué">
      <rect width="360" height="210" fill="#F2F1F7"/>
      <path d="M0 120 L360 96" stroke="#FFE3B3" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 120 L360 96" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M110 0 V210 M240 0 V210" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M58 168 L110 168 L110 112 L240 102 L240 52 L296 52" fill="none" stroke="#5A1A80" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="168" r="7" fill="#8C238A"/><circle cx="58" cy="168" r="7" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <path d="M296 50c-6-5-10-11-10-17a10 10 0 1 1 20 0c0 6-4 12-10 17z" fill="#F5A623"/>
    </svg>
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="content">
      <div class="head"><h1>Course Éco</h1><span class="chip-ok">Terminée</span></div>
      <p class="when">Aujourd'hui · 14 h 29 → 14 h 46 · 5,2 km</p>
      <div class="card">
        <div class="route">
          <div class="dotcol"><span class="dot" style="background:#8C238A"></span><span class="vline"></span><span class="dot" style="background:#F5A623"></span></div>
          <div><h4>Pharmacie du Gros-Bouquet</h4><h4>Lycée Léon Mba</h4></div>
        </div>
      </div>
      <div class="card">
        <div class="line"><span>Chauffeur</span><strong>Boris M. · ★ 4,8</strong></div>
        <div class="line"><span>Véhicule</span><strong>Toyota Corolla · <span class="mono">GA-482-LBV</span></strong></div>
        <div class="line"><span>Paiement</span><strong>Airtel Money · <span class="mono">MP2608…4471</span></strong></div>
        <div class="line"><span>Votre note</span><strong style="color:#F5A623">★★★★☆</strong></div>
        <div class="total"><span>Total payé</span><span class="mono">1 500 FCFA</span></div>
      </div>
      <div class="actions">
        <button class="btn sec-btn">Voir le reçu</button>
        <button class="btn warn-btn">Signaler un problème</button>
      </div>
    </div>
  </div>
</body></html>
