<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-11 Point de rencontre</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; inset:0; }
  .back { position:absolute; top:22px; left:16px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; }
  .widget { position:absolute; bottom:296px; left:16px; background:#FFFFFF; border-radius:9999px; box-shadow:0 8px 32px rgba(0,0,0,0.16); display:flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; }
  .widget .ring { width:28px; height:28px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; display:flex; align-items:center; justify-content:center; }
  .widget .qty { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:12px; font-weight:700; }
  .widget .cap { font-size:9px; color:#6B6B80; margin-top:-2px; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:#FFFFFF; border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,0.14); padding:8px 20px 22px; }
  .handle { width:36px; height:4px; border-radius:9999px; background:#E0E0EA; margin:0 auto 14px; }
  .eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6B6B80; margin:0 0 4px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 2px; color:#3D0F5C; }
  .meta { font-size:13px; color:#6B6B80; margin:0 0 12px; display:flex; align-items:center; gap:6px; }
  .badge-ok { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; background:#E6F9F0; color:#15874F; border-radius:9999px; padding:2px 8px; }
  .why { font-size:13px; line-height:1.5; color:#6B6B80; background:#F9F9FB; border-radius:12px; padding:10px 14px; margin:0 0 16px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
  .alt { height:48px; border:none; border-radius:20px; width:100%; background:#F5E6FF; color:#5A1A80; font-size:15px; font-weight:600; font-family:inherit; margin-top:8px; }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 800" role="img" aria-label="Trajet à pied de 2 minutes vers le point de rencontre à la pharmacie">
      <rect width="360" height="800" fill="#F2F1F7"/>
      <rect x="30" y="80" width="120" height="130" rx="4" fill="#E9E7F1"/>
      <rect x="225" y="60" width="115" height="120" rx="4" fill="#E9E7F1"/>
      <rect x="50" y="320" width="110" height="110" rx="4" fill="#E9E7F1"/>
      <path d="M0 270 L360 240" stroke="#FFE3B3" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 270 L360 240" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M185 0 V520 M0 130 H360 M0 450 H360" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M120 400 C150 380 200 330 246 268" fill="none" stroke="#8C238A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 9"/>
      <circle cx="120" cy="400" r="9" fill="#8C238A"/>
      <circle cx="120" cy="400" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="248" cy="252" r="30" fill="#F5A623" opacity="0.18"/>
      <path d="M248 264c-9-8-14-15-14-23a14 14 0 1 1 28 0c0 8-5 15-14 23z" fill="#F5A623"/>
      <circle cx="248" cy="240" r="5.5" fill="#FFF8E6"/>
      <text x="196" y="292" font-size="9" fill="#6B6B80" font-family="system-ui">Pharmacie du Gros-Bouquet</text>
      <rect x="128" y="330" rx="9" width="88" height="20" fill="#3D0F5C"/>
      <text x="172" y="344" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui">2 min à pied</text>
    </svg>
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="widget"><span class="ring"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>
      <span><span class="qty">13 Mo</span><br><span class="cap">ce mois</span></span></div>
    <div class="sheet">
      <div class="handle"></div>
      <p class="eyebrow">Point de rencontre</p>
      <h1>Pharmacie du Gros-Bouquet</h1>
      <p class="meta">2 min à pied · <span class="badge-ok">Repère validé</span></p>
      <p class="why">Votre chauffeur vous attendra ici — un point facile à trouver pour vous deux, sans explications au téléphone.</p>
      <button class="cta">Confirmer le point de rencontre</button>
      <button class="alt">Choisir un autre repère</button>
    </div>
  </div>
</body></html>
