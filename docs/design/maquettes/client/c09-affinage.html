<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-09 Affinage sur carte</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; inset:0; }
  .back { position:absolute; top:22px; left:16px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; }
  .widget { position:absolute; bottom:316px; left:16px; background:#FFFFFF; border-radius:9999px; box-shadow:0 8px 32px rgba(0,0,0,0.16); display:flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; }
  .widget .ring { width:28px; height:28px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; display:flex; align-items:center; justify-content:center; }
  .widget .qty { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:12px; font-weight:700; }
  .widget .cap { font-size:9px; color:#6B6B80; margin-top:-2px; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:#FFFFFF; border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,0.14); padding:8px 20px 22px; }
  .handle { width:36px; height:4px; border-radius:9999px; background:#E0E0EA; margin:0 auto 14px; }
  .eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6B6B80; margin:0 0 4px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 2px; color:#3D0F5C; }
  .near { font-size:13px; color:#6B6B80; margin:0 0 14px; }
  .chips { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .chip { height:36px; border-radius:9999px; padding:0 16px; display:flex; align-items:center; font-size:13px; font-weight:600; background:#F0F0F5; color:#4A4A60; }
  .chip.on { background:#F5E6FF; color:#5A1A80; border:1.5px solid #8C238A; }
  .hint { height:44px; border-radius:12px; background:#F0F0F5; display:flex; align-items:center; padding:0 14px; font-size:15px; color:#9090A8; margin-bottom:16px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 800" role="img" aria-label="Pin de départ ajustable près de la pharmacie du Gros-Bouquet">
      <rect width="360" height="800" fill="#F2F1F7"/>
      <rect x="30" y="70" width="130" height="140" rx="4" fill="#E9E7F1"/>
      <rect x="220" y="100" width="120" height="130" rx="4" fill="#E9E7F1"/>
      <rect x="50" y="300" width="120" height="120" rx="4" fill="#E9E7F1"/>
      <path d="M0 260 L360 230" stroke="#FFE3B3" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 260 L360 230" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M190 0 V520 M0 120 H360 M0 440 H360 M90 120 V440" stroke="#FFFFFF" stroke-width="6"/>
      <circle cx="180" cy="330" r="54" fill="#8C238A" opacity="0.08"/>
      <circle cx="180" cy="330" r="54" fill="none" stroke="#8C238A" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M258 232c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
      <text x="216" y="206" font-size="9" fill="#9090A8" font-family="system-ui">Pharmacie du Gros-Bouquet</text>
      <g>
        <ellipse cx="180" cy="342" rx="7" ry="3" fill="#3D0F5C" opacity="0.25"/>
        <path d="M180 336c-11-9-17-18-17-28a17 17 0 1 1 34 0c0 10-6 19-17 28z" fill="#8C238A"/>
        <circle cx="180" cy="307" r="6.5" fill="#FFFFFF"/>
      </g>
    </svg>
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="widget"><span class="ring"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>
      <span><span class="qty">12 Mo</span><br><span class="cap">ce mois</span></span></div>
    <div class="sheet">
      <div class="handle"></div>
      <p class="eyebrow">Point de départ</p>
      <h1>Glissez le pin sur votre position</h1>
      <p class="near">Près de : <strong>Pharmacie du Gros-Bouquet</strong> · 40 m</p>
      <div class="chips">
        <span class="chip on">Devant</span><span class="chip">Derrière</span><span class="chip">En face</span><span class="chip">À côté</span>
      </div>
      <div class="hint">Précision utile — ex. « portail bleu »</div>
      <button class="cta">Confirmer le départ</button>
    </div>
  </div>
</body></html>
