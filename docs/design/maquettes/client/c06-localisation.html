<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-06 Permission localisation</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .art { flex:1; display:flex; align-items:center; justify-content:center; }
  .content { padding:0 24px 44px; text-align:center; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.3px; margin:0 0 10px; color:#3D0F5C; }
  p.body { font-size:15px; line-height:1.5; color:#6B6B80; margin:0 auto 28px; max-width:32ch; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
  .ghost { height:48px; border:none; border-radius:20px; width:100%; background:transparent; color:#5A1A80; font-size:17px; font-weight:600; font-family:inherit; margin-top:8px; }
  .note { font-size:12px; color:#9090A8; margin:14px 0 0; }
</style></head><body>
  <div class="phone">
    <div class="art">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Position du passager entourée de repères proches">
        <circle cx="120" cy="120" r="104" fill="#F5E6FF" opacity="0.5"/>
        <circle cx="120" cy="120" r="72" fill="#F5E6FF" opacity="0.7"/>
        <circle cx="120" cy="120" r="40" fill="#E8C6FF" opacity="0.8"/>
        <circle cx="120" cy="120" r="13" fill="#8C238A"/>
        <circle cx="120" cy="120" r="13" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
        <path d="M52 74c-8-7-13-14-13-22a13 13 0 1 1 26 0c0 8-5 15-13 22z" fill="#F5A623"/>
        <circle cx="52" cy="52" r="4.5" fill="#FFF8E6"/>
        <path d="M196 106c-8-7-13-14-13-22a13 13 0 1 1 26 0c0 8-5 15-13 22z" fill="#F5A623"/>
        <circle cx="196" cy="84" r="4.5" fill="#FFF8E6"/>
        <path d="M86 208c-8-7-13-14-13-22a13 13 0 1 1 26 0c0 8-5 15-13 22z" fill="#F5A623"/>
        <circle cx="86" cy="186" r="4.5" fill="#FFF8E6"/>
      </svg>
    </div>
    <div class="content">
      <h1>Autour de vous</h1>
      <p class="body">Teko utilise votre position pour trouver les repères proches et suggérer le meilleur point de rencontre avec votre chauffeur.</p>
      <button class="cta">Autoriser la localisation</button>
      <button class="ghost">Plus tard</button>
      <p class="note">Sans localisation, choisissez simplement un repère. Modifiable à tout moment dans les réglages.</p>
    </div>
  </div>
</body></html>
