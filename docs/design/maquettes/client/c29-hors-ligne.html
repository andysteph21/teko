<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-29 Hors-ligne</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; box-sizing:border-box; }
  .art { width:120px; height:120px; border-radius:9999px; background:#F0F0F5; display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.3px; margin:0 0 8px; color:#3D0F5C; text-align:center; }
  p { font-size:15px; line-height:1.5; color:#6B6B80; margin:0 0 26px; text-align:center; max-width:30ch; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
  .tip { font-size:12px; color:#9090A8; margin:16px 0 0; text-align:center; }
</style></head><body>
  <div class="phone">
    <div class="art">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#9090A8" stroke-width="1.8">
        <path d="M5 12.5a7 7 0 0 1 11.8-5M19 12.5a7 7 0 0 1-.4 2.3"/>
        <path d="M8.5 15.5a3.8 3.8 0 0 1 6.4-2.7"/>
        <circle cx="12" cy="18.5" r="1.3" fill="#9090A8"/>
        <path d="M4 4l16 16" stroke="#E53E3E" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Pas de connexion</h1>
    <p>Vérifiez votre réseau mobile. Rien n'a été perdu — votre demande reprendra là où elle s'est arrêtée.</p>
    <button class="cta">Réessayer</button>
    <p class="tip">Astuce : le mode éco fonctionne même avec un signal très faible.</p>
  </div>
</body></html>
