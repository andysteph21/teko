<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-04 Code OTP</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .nav { padding:22px 16px 0; }
  .back { width:40px; height:40px; border-radius:9999px; background:#F0F0F5; display:flex; align-items:center; justify-content:center; }
  .content { padding:18px 24px 0; flex:1; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.3px; margin:0 0 8px; color:#3D0F5C; }
  .sub { font-size:15px; line-height:1.5; color:#6B6B80; margin:0 0 28px; }
  .sub strong { color:#323248; }
  .otp { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .otp span { width:46px; height:54px; border-radius:12px; background:#F0F0F5; border:1.5px solid transparent; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:24px; font-weight:700; }
  .otp .active { background:#FFFFFF; border-color:#8C238A; box-shadow:0 2px 6px rgba(0,0,0,0.10); }
  .resend { text-align:center; font-size:13px; color:#6B6B80; margin:0 0 26px; }
  .resend strong { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; }
  .divider { display:flex; align-items:center; gap:12px; color:#9090A8; font-size:12px; margin:0 0 16px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:#E0E0EA; }
  .alt { height:48px; border-radius:20px; background:#F5E6FF; color:#5A1A80; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; }
  .badge { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; background:#FFF8E6; color:#B57308; border-radius:9999px; padding:2px 8px; }
  .keys { background:#E0E0EA; padding:8px 6px 22px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .key { height:46px; background:#FFFFFF; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,0.07); }
  .key.blank { background:transparent; box-shadow:none; }
</style></head><body>
  <div class="phone">
    <div class="nav"><div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div></div>
    <div class="content">
      <h1>Code de vérification</h1>
      <p class="sub">Envoyé par SMS au <strong>+241 06 12 34 56</strong>. <span style="color:#5A1A80;font-weight:600">Modifier</span></p>
      <div class="otp"><span>4</span><span>7</span><span>2</span><span class="active"></span><span></span><span></span></div>
      <p class="resend">Renvoyer le code dans <strong>27 s</strong></p>
      <div class="divider">ou</div>
      <div class="alt">Recevoir le code par e-mail <span class="badge">MVP</span></div>
    </div>
    <div class="keys">
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div class="key blank"></div><div class="key">0</div><div class="key"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2"><path d="M20 6H9L4 12l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12 10l4 4M16 10l-4 4"/></svg></div>
    </div>
  </div>
</body></html>
