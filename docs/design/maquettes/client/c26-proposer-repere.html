<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-26 Proposer un repère</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .map { height:230px; position:relative; }
  .back { position:absolute; top:22px; left:16px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; }
  .content { flex:1; padding:16px 24px 0; margin-top:-18px; background:#F9F9FB; border-radius:20px 20px 0 0; position:relative; }
  h1 { font-size:20px; font-weight:700; margin:0 0 4px; color:#3D0F5C; }
  .sub { font-size:13px; color:#6B6B80; margin:0 0 16px; }
  .field-label { font-size:13px; font-weight:600; margin:0 0 6px; }
  .opt { color:#9090A8; font-weight:400; }
  .input { height:46px; border-radius:12px; background:#F0F0F5; display:flex; align-items:center; padding:0 14px; font-size:15px; margin-bottom:14px; }
  .cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { height:34px; border-radius:9999px; padding:0 14px; display:flex; align-items:center; font-size:13px; font-weight:600; background:#F0F0F5; color:#4A4A60; }
  .chip.on { background:#F5E6FF; color:#5A1A80; border:1.5px solid #8C238A; }
  .photo { border:1.5px dashed #C4C4D4; border-radius:12px; height:56px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; color:#6B6B80; margin-bottom:12px; }
  .note { font-size:12px; color:#6B6B80; margin:0 0 14px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 230" role="img" aria-label="Choisir la position du nouveau repère">
      <rect width="360" height="230" fill="#F2F1F7"/>
      <path d="M0 130 L360 106" stroke="#FFE3B3" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 130 L360 106" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M120 0 V230 M250 0 V230" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="180" cy="120" r="34" fill="#F5A623" opacity="0.14"/>
      <path d="M180 132c-9-8-14-15-14-23a14 14 0 1 1 28 0c0 8-5 15-14 23z" fill="#F5A623"/>
      <circle cx="180" cy="108" r="5.5" fill="#FFF8E6"/>
    </svg>
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="content">
      <h1>Proposer un repère</h1>
      <p class="sub">Vous aidez toute la ville à se repérer. Position : glissez le pin sur la carte.</p>
      <p class="field-label">Nom du repère</p>
      <div class="input">Boulangerie d'Akébé</div>
      <p class="field-label">Catégorie</p>
      <div class="cats">
        <span class="chip">Pharmacie</span><span class="chip on">Commerce</span><span class="chip">École</span><span class="chip">Église</span><span class="chip">Autre</span>
      </div>
      <div class="photo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B80" stroke-width="2"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg>Ajouter une photo <span class="opt">· optionnel</span></div>
      <p class="note">Vérifié par l'équipe Teko sous 48 h — vous serez notifiée du résultat.</p>
      <button class="cta">Envoyer la proposition</button>
    </div>
  </div>
</body></html>
