<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-27 Partage / SOS</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; inset:0; filter:saturate(0.6); }
  .scrim { position:absolute; inset:0; background:rgba(15,15,30,0.55); }
  .modal { position:absolute; left:16px; right:16px; bottom:20px; background:#FFFFFF; border-radius:20px; box-shadow:0 16px 48px rgba(0,0,0,0.22); padding:22px 20px; }
  .sos-ico { width:60px; height:60px; border-radius:9999px; background:#FFF0F0; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 4px; text-align:center; color:#3D0F5C; }
  .sub { font-size:13px; color:#6B6B80; margin:0 0 18px; text-align:center; }
  .act { display:flex; align-items:center; gap:12px; border:1.5px solid #E0E0EA; border-radius:16px; padding:13px 14px; margin-bottom:10px; }
  .act.urgent { border-color:#E53E3E; background:#FFF0F0; }
  .ico { width:38px; height:38px; border-radius:9999px; display:flex; align-items:center; justify-content:center; flex:none; }
  .act h4 { font-size:15px; font-weight:600; margin:0; }
  .act p { font-size:12px; color:#6B6B80; margin:1px 0 0; }
  .close { display:block; text-align:center; font-size:14px; font-weight:600; color:#6B6B80; margin:8px auto 0; }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 800"><rect width="360" height="800" fill="#F2F1F7"/><path d="M0 300 L360 270" stroke="#FFE3B3" stroke-width="16" stroke-linecap="round"/><path d="M0 300 L360 270" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/><path d="M180 0 V800 M0 140 H360 M0 470 H360" stroke="#FFFFFF" stroke-width="6"/><g transform="translate(165,330)"><rect rx="5" width="30" height="17" fill="#00BFA5"/></g></svg>
    <div class="scrim"></div>
    <div class="modal">
      <div class="sos-ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2.4"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.5v.01"/></svg></div>
      <h1>Besoin d'aide ?</h1>
      <p class="sub">Votre position et votre course : Boris M. · GA-482-LBV · vers Lycée Léon Mba</p>
      <div class="act urgent">
        <span class="ico" style="background:#FFFFFF"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2.2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>
        <div><h4>Appeler les secours</h4><p>Appel direct depuis votre téléphone</p></div>
      </div>
      <div class="act">
        <span class="ico" style="background:#F5E6FF"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg></span>
        <div><h4>Partager mon trajet en direct</h4><p>Lien de suivi par SMS ou WhatsApp</p></div>
      </div>
      <div class="act">
        <span class="ico" style="background:#E6F0FF"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1 1-1.1 1.8M12 17v.01"/></svg></span>
        <div><h4>Signaler un problème à Teko</h4><p>L'équipe vous rappelle en priorité</p></div>
      </div>
      <a class="close">Fermer</a>
    </div>
  </div>
</body></html>
