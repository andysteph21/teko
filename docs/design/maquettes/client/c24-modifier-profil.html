<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-24 Modifier le profil</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .nav { padding:22px 16px 0; display:flex; align-items:center; gap:12px; }
  .back { width:40px; height:40px; border-radius:9999px; background:#F0F0F5; display:flex; align-items:center; justify-content:center; }
  .nav h1 { font-size:20px; font-weight:700; margin:0; color:#3D0F5C; }
  .content { padding:20px 24px 0; flex:1; }
  .avatar-zone { display:flex; justify-content:center; margin-bottom:22px; }
  .avatar { width:84px; height:84px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; font-weight:700; font-size:30px; display:flex; align-items:center; justify-content:center; position:relative; }
  .avatar .cam { position:absolute; right:-2px; bottom:-2px; width:30px; height:30px; border-radius:9999px; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); border:3px solid #F9F9FB; display:flex; align-items:center; justify-content:center; }
  .field-label { font-size:13px; font-weight:600; margin:0 0 6px; }
  .opt { color:#9090A8; font-weight:400; }
  .input { height:48px; border-radius:12px; background:#F0F0F5; display:flex; align-items:center; padding:0 14px; font-size:16px; margin-bottom:14px; }
  .badge { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; background:#FFF8E6; color:#B57308; border-radius:9999px; padding:1px 7px; }
  .num-row { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; margin:6px 0 18px; }
  .num-row .ico { width:34px; height:34px; border-radius:9999px; background:#F5E6FF; display:flex; align-items:center; justify-content:center; flex:none; }
  .num-row h4 { font-size:14px; font-weight:600; margin:0; }
  .num-row p { font-size:12px; color:#6B6B80; margin:1px 0 0; line-height:1.4; }
  .chev { margin-left:auto; color:#C4C4D4; font-size:18px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
</style></head><body>
  <div class="phone">
    <div class="nav"><div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div><h1>Modifier le profil</h1></div>
    <div class="content">
      <div class="avatar-zone"><div class="avatar">N<span class="cam"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg></span></div></div>
      <p class="field-label">Prénom</p>
      <div class="input">Nadia</div>
      <p class="field-label">Nom <span class="opt">· optionnel</span></p>
      <div class="input">Obame</div>
      <p class="field-label">E-mail <span class="opt">· optionnel</span> <span class="badge">MVP</span></p>
      <div class="input">nadia.o@exemple.com</div>
      <div class="num-row">
        <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10 18h4"/></svg></span>
        <div><h4>Changer de numéro</h4><p>Actuel : +241 06 12 34 56 — vérification par code sur l'ancien puis le nouveau numéro.</p></div>
        <span class="chev">›</span>
      </div>
      <button class="cta">Enregistrer</button>
    </div>
  </div>
</body></html>
