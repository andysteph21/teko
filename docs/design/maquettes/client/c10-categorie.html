<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-10 Catégorie & estimation</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; top:0; left:0; right:0; height:330px; }
  .back { position:absolute; top:22px; left:16px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; }
  .widget { position:absolute; top:264px; left:16px; background:#FFFFFF; border-radius:9999px; box-shadow:0 8px 32px rgba(0,0,0,0.16); display:flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; }
  .widget .ring { width:28px; height:28px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; display:flex; align-items:center; justify-content:center; }
  .widget .qty { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:12px; font-weight:700; }
  .widget .cap { font-size:9px; color:#6B6B80; margin-top:-2px; }
  .sheet { position:absolute; left:0; right:0; bottom:0; top:318px; background:#FFFFFF; border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,0.14); padding:8px 20px 0; }
  .handle { width:36px; height:4px; border-radius:9999px; background:#E0E0EA; margin:0 auto 12px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 12px; color:#3D0F5C; }
  .cat { border:1.5px solid #E0E0EA; border-radius:16px; padding:10px 14px; display:flex; align-items:center; gap:12px; margin-bottom:8px; background:#FFFFFF; }
  .cat.selected { border-color:#8C238A; background:#F5E6FF; box-shadow:0 2px 6px rgba(0,0,0,0.10); }
  .cat .ico { width:38px; height:38px; border-radius:9999px; background:#F0F0F5; display:flex; align-items:center; justify-content:center; flex:none; }
  .cat.selected .ico { background:#FFFFFF; }
  .cat h3 { font-size:15px; font-weight:600; margin:0; }
  .cat p { font-size:11.5px; color:#6B6B80; margin:1px 0 0; }
  .price { margin-left:auto; font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:16px; font-weight:700; }
  .pay { display:flex; gap:8px; margin:12px 0 10px; }
  .pay-chip { flex:1; height:44px; border-radius:12px; border:1.5px solid #E0E0EA; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; font-weight:600; color:#4A4A60; }
  .pay-chip.on { border-color:#8C238A; background:#F5E6FF; color:#5A1A80; }
  .fixed { font-size:12px; color:#6B6B80; text-align:center; margin:0 0 10px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); display:flex; align-items:center; justify-content:center; gap:10px; }
  .cta .mono { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; }
  .later { display:block; text-align:center; font-size:13px; font-weight:600; color:#5A1A80; margin:10px auto 0; }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 330" role="img" aria-label="Itinéraire de la pharmacie du Gros-Bouquet au lycée Léon Mba">
      <rect width="360" height="330" fill="#F2F1F7"/>
      <rect x="24" y="40" width="110" height="100" rx="4" fill="#E9E7F1"/>
      <rect x="230" y="180" width="110" height="110" rx="4" fill="#E9E7F1"/>
      <path d="M0 170 L360 140" stroke="#FFE3B3" stroke-width="14" stroke-linecap="round"/>
      <path d="M0 170 L360 140" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M120 0 V330 M250 0 V330 M0 70 H360 M0 260 H360" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M64 258 L120 258 L120 162 L250 152 L250 84 L296 84" fill="none" stroke="#5A1A80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="258" r="8" fill="#8C238A"/>
      <circle cx="64" cy="258" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M296 82c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
      <text x="34" y="282" font-size="9" fill="#6B6B80" font-family="system-ui">Départ · Pharmacie</text>
      <text x="262" y="110" font-size="9" fill="#6B6B80" font-family="system-ui">Lycée Léon Mba</text>
      <rect x="150" y="196" rx="9" width="64" height="20" fill="#3D0F5C"/>
      <text x="182" y="210" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui">14 min</text>
    </svg>
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="widget"><span class="ring"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>
      <span><span class="qty">13 Mo</span><br><span class="cap">ce mois</span></span></div>
    <div class="sheet">
      <div class="handle"></div>
      <h1>Choisissez votre course</h1>
      <div class="cat selected"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2"><path d="M5 16l1.5-5h11L19 16"/><rect x="4" y="15" width="16" height="4" rx="1.5"/><circle cx="7.5" cy="19.5" r="1.4"/><circle cx="16.5" cy="19.5" r="1.4"/></svg></div>
        <div><h3>Éco</h3><p>4 places · arrivée 6 min</p></div><span class="price">1 500 FCFA</span></div>
      <div class="cat"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4A60" stroke-width="2"><circle cx="6" cy="17" r="2.6"/><circle cx="18" cy="17" r="2.6"/><path d="M6 17h6l3-7h3M11 8h4l3 9"/></svg></div>
        <div><h3>Moto-taxi</h3><p>1 place · arrivée 3 min</p></div><span class="price">800 FCFA</span></div>
      <div class="cat"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4A60" stroke-width="2"><path d="M5 16l1.5-5h11L19 16"/><rect x="4" y="15" width="16" height="4" rx="1.5"/><circle cx="7.5" cy="19.5" r="1.4"/><circle cx="16.5" cy="19.5" r="1.4"/><path d="M8 8h8"/></svg></div>
        <div><h3>Confort</h3><p>4 places · clim · arrivée 9 min</p></div><span class="price">2 500 FCFA</span></div>
      <div class="pay">
        <div class="pay-chip on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3"/></svg>Espèces</div>
        <div class="pay-chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10 18h4"/></svg>Airtel Money</div>
      </div>
      <p class="fixed">Prix fixe, calculé à l'avance — aucun marchandage.</p>
      <button class="cta">Commander Éco · <span class="mono">1 500 FCFA</span></button>
      <a class="later">Planifier pour plus tard</a>
    </div>
  </div>
</body></html>
