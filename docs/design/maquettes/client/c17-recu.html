<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-17 Reçu</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .content { padding:34px 24px 0; flex:1; }
  .check { width:64px; height:64px; border-radius:9999px; background:#E6F9F0; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.3px; margin:0 0 2px; text-align:center; color:#3D0F5C; }
  .date { font-size:13px; color:#6B6B80; margin:0 0 20px; text-align:center; }
  .receipt { background:#FFFFFF; border:1px solid #E0E0EA; border-radius:16px; padding:18px; box-shadow:0 2px 6px rgba(0,0,0,0.07); }
  .route { display:flex; gap:12px; padding-bottom:14px; border-bottom:1px dashed #E0E0EA; margin-bottom:14px; }
  .dotcol { display:flex; flex-direction:column; align-items:center; padding-top:5px; }
  .dot { width:8px; height:8px; border-radius:9999px; }
  .vline { width:2px; flex:1; min-height:16px; background:#E0E0EA; margin:2px 0; }
  .route h4 { font-size:13.5px; font-weight:600; margin:0 0 10px; }
  .route h4:last-child { margin:0; }
  .line { display:flex; justify-content:space-between; font-size:13.5px; margin:6px 0; color:#6B6B80; }
  .line strong { color:#323248; font-weight:600; }
  .mono { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-variant-numeric:tabular-nums; }
  .total { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid #F0F0F5; margin-top:10px; padding-top:12px; }
  .total .lbl { font-size:15px; font-weight:700; }
  .total .amt { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:24px; font-weight:900; }
  .paid { display:flex; align-items:center; gap:8px; font-size:12.5px; color:#15874F; background:#E6F9F0; border-radius:9999px; padding:6px 14px; width:fit-content; margin:14px auto 0; font-weight:600; }
  .actions { margin-top:20px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
  .ghost { height:48px; border:none; border-radius:20px; width:100%; background:transparent; color:#5A1A80; font-size:15px; font-weight:600; font-family:inherit; margin-top:6px; }
</style></head><body>
  <div class="phone">
    <div class="content">
      <div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22C47A" stroke-width="2.6"><path d="M4.5 12.5l5 5 10-11"/></svg></div>
      <h1>Course terminée</h1>
      <p class="date">Aujourd'hui · 14 h 46 · Reçu n° <span class="mono">TK-2608-0147</span></p>
      <div class="receipt">
        <div class="route">
          <div class="dotcol"><span class="dot" style="background:#8C238A"></span><span class="vline"></span><span class="dot" style="background:#F5A623"></span></div>
          <div><h4>Pharmacie du Gros-Bouquet · 14 h 29</h4><h4>Lycée Léon Mba · 14 h 46</h4></div>
        </div>
        <div class="line"><span>Course Éco · 14 min · 5,2 km</span><strong class="mono">1 500 FCFA</strong></div>
        <div class="line"><span>Chauffeur</span><strong>Boris M. · GA-482-LBV</strong></div>
        <div class="line"><span>Paiement</span><strong>Airtel Money · <span class="mono">MP2608…4471</span></strong></div>
        <div class="total"><span class="lbl">Total payé</span><span class="amt">1 500 FCFA</span></div>
        <div class="paid"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4.5 12.5l5 5 10-11"/></svg>Paiement confirmé</div>
      </div>
      <div class="actions">
        <button class="cta">Retour à l'accueil</button>
        <button class="ghost">Partager le reçu</button>
      </div>
    </div>
  </div>
</body></html>
