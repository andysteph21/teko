<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-16 Évaluation</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F9F9FB; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .skip-bar { display:flex; justify-content:flex-end; padding:22px 16px 0; }
  .skip { font-size:15px; font-weight:600; color:#6B6B80; }
  .content { padding:10px 24px 0; flex:1; text-align:center; }
  .avatar { width:76px; height:76px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; font-weight:700; font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.3px; margin:0 0 4px; color:#3D0F5C; }
  .sub { font-size:14px; color:#6B6B80; margin:0 0 22px; }
  .stars { display:flex; justify-content:center; gap:10px; margin-bottom:8px; }
  .stars svg { width:40px; height:40px; }
  .verdict { font-size:15px; font-weight:600; color:#F5A623; margin:0 0 22px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
  .chip { height:36px; border-radius:9999px; padding:0 14px; display:flex; align-items:center; font-size:13px; font-weight:600; background:#F0F0F5; color:#4A4A60; }
  .chip.on { background:#F5E6FF; color:#5A1A80; border:1.5px solid #8C238A; }
  .comment { min-height:76px; border-radius:12px; background:#F0F0F5; padding:12px 14px; font-size:14px; color:#9090A8; text-align:left; margin-bottom:18px; }
  .cta { height:48px; border:none; border-radius:20px; width:100%; background:linear-gradient(135deg,#5A1A80 0%,#8C238A 100%); color:#fff; font-size:17px; font-weight:600; font-family:inherit; box-shadow:0 4px 24px rgba(90,26,128,0.35); }
</style></head><body>
  <div class="phone">
    <div class="skip-bar"><span class="skip">Passer</span></div>
    <div class="content">
      <div class="avatar">BM</div>
      <h1>Comment était la course ?</h1>
      <p class="sub">Boris M. · Éco · aujourd'hui 14 h 46</p>
      <div class="stars">
        <svg viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
        <svg viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
        <svg viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
        <svg viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
        <svg viewBox="0 0 24 24" fill="#E0E0EA"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
      </div>
      <p class="verdict">Très bien</p>
      <div class="chips">
        <span class="chip on">Conduite prudente</span><span class="chip">Ponctuel</span><span class="chip on">Aimable</span><span class="chip">Véhicule propre</span>
      </div>
      <div class="comment">Un commentaire ? (optionnel)</div>
      <button class="cta">Envoyer</button>
    </div>
  </div>
</body></html>
