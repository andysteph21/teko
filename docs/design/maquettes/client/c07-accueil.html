<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>C-07 Accueil</title>
<style>
  body { margin:0; background:#E0E0EA; display:flex; justify-content:center; font-family:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif; color:#323248; }
  .phone { width:360px; height:800px; background:#F2F1F7; position:relative; overflow:hidden; }
  .map { position:absolute; inset:0; }
  .avatar-chip { position:absolute; top:22px; right:16px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; font-weight:700; color:#5A1A80; font-size:16px; }
  .bell { position:absolute; top:22px; right:70px; width:44px; height:44px; border-radius:9999px; background:#FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; }
  .bell .dot { position:absolute; top:10px; right:11px; width:9px; height:9px; border-radius:9999px; background:#E53E3E; border:2px solid #FFFFFF; }
  .widget { position:absolute; bottom:266px; left:16px; background:#FFFFFF; border-radius:9999px; box-shadow:0 8px 32px rgba(0,0,0,0.16); display:flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; }
  .widget .ring { width:28px; height:28px; border-radius:9999px; background:#F5E6FF; color:#5A1A80; display:flex; align-items:center; justify-content:center; }
  .widget .qty { font-family:ui-monospace,'SF Mono','Roboto Mono',monospace; font-size:12px; font-weight:700; }
  .widget .cap { font-size:9px; color:#6B6B80; margin-top:-2px; }
  .sheet { position:absolute; left:0; right:0; bottom:0; height:250px; background:#FFFFFF; border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,0.14); padding:8px 20px 0; }
  .handle { width:36px; height:4px; border-radius:9999px; background:#E0E0EA; margin:0 auto 14px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 12px; color:#3D0F5C; }
  .search { height:48px; border-radius:12px; background:#F0F0F5; display:flex; align-items:center; gap:10px; padding:0 14px; font-size:17px; color:#9090A8; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #F0F0F5; }
  .row:last-of-type { border-bottom:none; }
  .lm-ico { width:34px; height:34px; border-radius:9999px; background:#FFF8E6; display:flex; align-items:center; justify-content:center; flex:none; }
  .row h4 { font-size:14px; font-weight:600; margin:0; }
  .row p { font-size:11px; color:#6B6B80; margin:1px 0 0; }
</style></head><body>
  <div class="phone">
    <svg class="map" viewBox="0 0 360 800" role="img" aria-label="Carte de Libreville, position de Nadia au centre">
      <rect width="360" height="800" fill="#F2F1F7"/>
      <rect x="24" y="90" width="120" height="150" rx="4" fill="#E9E7F1"/>
      <rect x="210" y="60" width="130" height="120" rx="4" fill="#E9E7F1"/>
      <rect x="40" y="330" width="110" height="130" rx="4" fill="#E9E7F1"/>
      <rect x="230" y="300" width="110" height="160" rx="4" fill="#E9E7F1"/>
      <ellipse cx="300" cy="620" rx="90" ry="70" fill="#DCEFE3"/>
      <path d="M0 280 L360 240" stroke="#FFE3B3" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 280 L360 240" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <path d="M180 0 V800" stroke="#FFFFFF" stroke-width="10"/>
      <path d="M0 120 H360 M0 490 H360 M0 660 H300" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M90 120 V500 M270 60 V800" stroke="#FFFFFF" stroke-width="6"/>
      <text x="30" y="112" font-size="9" fill="#9090A8" font-family="system-ui">Mont-Bouët</text>
      <text x="238" y="292" font-size="9" fill="#9090A8" font-family="system-ui">Gros-Bouquet</text>
      <path d="M270 236c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
      <path d="M96 500c-7-6-11-12-11-19a11 11 0 1 1 22 0c0 7-4 13-11 19z" fill="#F5A623"/>
      <circle cx="180" cy="390" r="26" fill="#8C238A" opacity="0.15"/>
      <circle cx="180" cy="390" r="9" fill="#8C238A"/>
      <circle cx="180" cy="390" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </svg>
    <div class="bell"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#323248" stroke-width="2.2"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><span class="dot"></span></div>
    <div class="avatar-chip">N</div>
    <div class="widget"><span class="ring"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18v-6M10 18V9M16 18V4"/></svg></span>
      <span><span class="qty">12 Mo</span><br><span class="cap">ce mois</span></span></div>
    <div class="sheet">
      <div class="handle"></div>
      <h1>Où allez-vous ?</h1>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2.2"><path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        Chercher un repère…
      </div>
      <div class="row"><div class="lm-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B57308" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg></div>
        <div><h4>Lycée Léon Mba</h4><p>Récent · hier</p></div></div>
      <div class="row"><div class="lm-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B57308" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg></div>
        <div><h4>Marché du Mont-Bouët</h4><p>Récent · lundi</p></div></div>
      <div class="row"><div class="lm-ico" style="background:#F0F0F5"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5A1A80" stroke-width="2.2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 11h16"/></svg></div>
        <div><h4>Planifier une course</h4><p>Choisir la date et l'heure</p></div></div>
    </div>
  </div>
</body></html>
